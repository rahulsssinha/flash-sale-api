spring.application.name=flash-sale-api

spring.datasource.url=jdbc:mysql://localhost:3307/flash_sale
spring.datasource.username=flashuser
spring.datasource.password=flashpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

resilience4j.ratelimiter.instances.purchaseLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.purchaseLimiter.limit-refresh-period=1s
resilience4j.ratelimiter.instances.purchaseLimiter.timeout-duration=0